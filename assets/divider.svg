<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#36BCF7"/>
      <animate attributeName="x1" values="0;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;600" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="900" height="6" rx="3" fill="url(#g)"/>
