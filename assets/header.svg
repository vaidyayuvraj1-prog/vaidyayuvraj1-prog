<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yuvraj Vaidya - AI and Data Science Student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"><animate attributeName="stop-color" values="#0f2027;#1b2b4b;#0f2027" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"><animate attributeName="stop-color" values="#2c5364;#3a1c71;#2c5364" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240" rx="18"/></clipPath>
    <style>
      .title { font: 700 48px 'Segoe UI', Arial, sans-serif; fill: #fff; animation: rise 1.1s ease-out both; }
      .sub   { font: 500 20px 'Courier New', monospace; fill: #36BCF7; animation: fade 1.6s ease 0.7s both; }
      .tag   { font: 400 15px 'Courier New', monospace; fill: #cbd5e1; animation: fade 1.6s ease 1.4s both; }
      .wave  { font-size: 44px; transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.2s ease-in-out infinite; }
      .line  { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.4s ease 0.9s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>

    <!-- floating bubbles -->
    <circle cx="90"  cy="190" r="26" fill="#36BCF7" opacity="0.12"><animate attributeName="cy" values="190;150;190" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="60"  r="14" fill="#a78bfa" opacity="0.18"><animate attributeName="cy" values="60;95;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="50"  r="30" fill="#a78bfa" opacity="0.12"><animate attributeName="cy" values="50;85;50" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="190" r="18" fill="#36BCF7" opacity="0.16"><animate attributeName="cy" values="190;160;190" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="215" r="10" fill="#ffffff" opacity="0.10"><animate attributeName="cy" values="215;180;215" dur="5.5s" repeatCount="indefinite"/></circle>

    <!-- twinkling stars -->
    <circle cx="150" cy="30"  r="2" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="30"  r="2" fill="#fff"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="205" r="2" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="115" r="2" fill="#fff"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="45"  cy="105" r="2" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>

    <text class="title" x="440" y="105" text-anchor="middle">Yuvraj Vaidya</text>
    <text class="wave" x="665" y="102">👋</text>
    <line class="line" x1="300" y1="125" x2="600" y2="125" stroke="url(#shine)" stroke-width="3" stroke-linecap="round"/>
    <text class="sub" x="450" y="162" text-anchor="middle">AI &amp; Data Science Student</text>
    <text class="tag" x="450" y="195" text-anchor="middle">Code. Learn. Build. Repeat.</text>
  </g>
</svg>
